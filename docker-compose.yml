services:
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["5173:5173"]
    environment: {VITE_API_PROXY: "http://backend:8000"}
    depends_on: [backend]
